<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCANA Mines</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">ARCANA <span>◆</span></a><nav><a href="/mines.html">MINES</a><a href="/coinflip.html">COIN FLIP</a><a href="/dice.html">DICE</a><a href="/keno.html">KENO</a></nav><div class="wallet">DEMO <b>10 000</b> ◆</div></header><main class="game-page"><div class="game-shell"><aside class="side"><div class="side-banner gold">MINES<span>ORIGINAL DEMO GAME</span></div><h3>Количество мин</h3><input class="field" id="mines" type="number" min="1" max="10" value="3"><h3>Ставка</h3><input class="field" value="100"><button class="action" id="start">НАЧАТЬ ИГРУ</button><p class="muted" id="msg">Выбери количество мин и начни раунд.</p></aside><section class="game-stage"><div class="stage-title">💣 MINES · CURRENT MULTIPLIER</div><div class="mine-top"><b>МИН: <span id="mc">3</span></b><div class="jackpot" id="mult">×1.00</div><b>ОТКРЫТО: <span id="opened">0</span></b></div><div class="mine-grid" id="grid"></div><div class="game-bottom"><span>БАЛАНС: 10 000</span><span>ВЫИГРЫШ: <b id="win">0</b></span></div></section></div></main><script>let bombs=[],open=0,run=false;const g=document.querySelector('#grid');function build(){g.innerHTML='';for(let i=0;i<25;i++){let b=document.createElement('button');b.className='mine-cell';b.textContent='◆';b.onclick=()=>pick(i,b);g.append(b)}}function start(){open=0;run=true;let n=+mines.value;mc.textContent=n;bombs=[];while(bombs.length<n){let x=Math.floor(Math.random()*25);if(!bombs.includes(x))bombs.push(x)}opened.textContent=0;mult.textContent='×1.00';win.textContent=0;msg.textContent='Раунд активен';build()}function pick(i,b){if(!run||b.disabled)return;b.disabled=true;if(bombs.includes(i)){b.textContent='💣';b.classList.add('bomb');run=false;msg.textContent='Бум! Раунд завершён.';document.querySelectorAll('.mine-cell').forEach((x,j)=>{if(bombs.includes(j)){x.textContent='💣';x.classList.add('bomb')}})}else{b.textContent='💎';b.classList.add('safe');open++;opened.textContent=open;let m=(1+open*.14).toFixed(2);mult.textContent='×'+m;win.textContent=Math.round(100*(m-1))}}start.onclick=start;mines.oninput=()=>mc.textContent=mines.value;build()</script></body></html>
