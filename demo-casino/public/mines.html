<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCANA Mines</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">ARCANA <span>◆</span></a><nav><a href="/mines.html">MINES</a><a href="/coinflip.html">COIN FLIP</a><a href="/dice.html">DICE</a><a href="/keno.html">KENO</a></nav><div class="wallet">DEMO <b>10 000</b> ◆</div></header><main class="game-page"><div class="game-shell"><aside class="side"><div class="side-banner gold">MINES<span>ORIGINAL DEMO GAME</span></div><h3>Количество мин (1–24)</h3><input class="field" id="minesInput" type="number" min="1" max="24" value="3"><h3>Ставка</h3><input class="field" id="betInput" type="number" min="1" value="100"><button class="action" id="startBtn">НАЧАТЬ ИГРУ</button><button class="action" id="cashBtn" disabled>ЗАБРАТЬ ВЫИГРЫШ</button><p class="muted" id="msg">Выбери количество мин и начни раунд.</p></aside><section class="game-stage"><div class="stage-title">💣 MINES · CURRENT MULTIPLIER</div><div class="mine-top"><b>МИН: <span id="mc">3</span></b><div class="jackpot" id="mult">×1.00</div><b>ОТКРЫТО: <span id="opened">0</span></b></div><div class="mine-grid" id="grid"></div><div class="game-bottom"><span>БАЛАНС: <b class="balance-value">10 000</b></span><span>ВЫИГРЫШ: <b id="win">0</b></span></div></section></div></main><script>const BALKEY='arcanaDemoBalance';function getBal(){return Number(localStorage.getItem(BALKEY)||10000)}function setBal(v){localStorage.setItem(BALKEY,Math.max(0,Math.round(v)));document.querySelectorAll('.wallet b,.balance-value').forEach(x=>x.textContent=getBal().toLocaleString('ru-RU'))}document.addEventListener('DOMContentLoaded',()=>setBal(getBal()));</script><script>let bombs=[],openedCount=0,running=false,roundBet=0;const grid=document.getElementById('grid'),mi=document.getElementById('minesInput'),bi=document.getElementById('betInput'),startBtn=document.getElementById('startBtn'),cashBtn=document.getElementById('cashBtn');function build(){grid.innerHTML='';for(let i=0;i<25;i++){const b=document.createElement('button');b.className='mine-cell';b.textContent='◆';b.onclick=()=>pick(i,b);grid.appendChild(b)}}function startGame(){let n=Math.max(1,Math.min(24,Number(mi.value)||1));mi.value=n;let bet=Math.max(1,Number(bi.value)||0);if(bet>getBal()){msg.textContent='Недостаточно DEMO баланса';return}roundBet=bet;setBal(getBal()-bet);openedCount=0;running=true;bombs=[];while(bombs.length<n){let x=Math.floor(Math.random()*25);if(!bombs.includes(x))bombs.push(x)}mc.textContent=n;opened.textContent=0;mult.textContent='×1.00';win.textContent=0;msg.textContent='Раунд активен — открывай клетки';cashBtn.disabled=false;build()}function finishLose(){running=false;cashBtn.disabled=true;msg.textContent='💥 Бум! Ставка потеряна.'}function pick(i,b){if(!running||b.disabled)return;b.disabled=true;if(bombs.includes(i)){b.textContent='💣';b.classList.add('bomb');[...grid.children].forEach((x,j)=>{if(bombs.includes(j)){x.textContent='💣';x.classList.add('bomb')}});finishLose();return}b.textContent='💎';b.classList.add('safe');openedCount++;opened.textContent=openedCount;let m=1+openedCount*(0.12+Number(mi.value)*0.008);mult.textContent='×'+m.toFixed(2);win.textContent=Math.round(roundBet*m)}function cash(){if(!running)return;let amount=Number(win.textContent)||roundBet;setBal(getBal()+amount);running=false;cashBtn.disabled=true;msg.textContent='✓ Выигрыш зачислен: '+amount;[...grid.children].forEach(x=>x.disabled=true)}startBtn.addEventListener('click',startGame);cashBtn.addEventListener('click',cash);mi.addEventListener('input',()=>mc.textContent=Math.max(1,Math.min(24,mi.value||1)));build()</script></body></html>
