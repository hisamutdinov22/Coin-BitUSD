<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCANA Keno</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">ARCANA <span>◆</span></a><nav><a href="/mines.html">MINES</a><a href="/coinflip.html">COIN FLIP</a><a href="/dice.html">DICE</a><a href="/keno.html">KENO</a></nav><div class="wallet">DEMO <b>10 000</b> ◆</div></header><main class="game-page"><div class="game-shell"><aside class="side"><div class="side-banner">KENO<span>CHOOSE YOUR NUMBERS</span></div><h3>Ставка</h3><input class="field" id="bet" type="number" min="1" value="100"><h3>Риск</h3><div class="seg"><button>НИЗКИЙ</button><button class="active">СРЕДНИЙ</button><button>ВЫСОКИЙ</button></div><button class="action" id="draw">РОЗЫГРЫШ</button><button class="action" id="auto">АВТОВЫБОР</button><button class="action danger" id="clear">ОЧИСТИТЬ</button><p class="muted" id="km">Выбрано: 0/10</p></aside><section class="game-stage"><div class="stage-title">KENO · ВЫБЕРИ ДО 10 ЧИСЕЛ</div><div class="keno-board" id="board"><button class="keno-num">1</button><button class="keno-num">2</button><button class="keno-num">3</button><button class="keno-num">4</button><button class="keno-num">5</button><button class="keno-num">6</button><button class="keno-num">7</button><button class="keno-num">8</button><button class="keno-num">9</button><button class="keno-num">10</button><button class="keno-num">11</button><button class="keno-num">12</button><button class="keno-num">13</button><button class="keno-num">14</button><button class="keno-num">15</button><button class="keno-num">16</button><button class="keno-num">17</button><button class="keno-num">18</button><button class="keno-num">19</button><button class="keno-num">20</button><button class="keno-num">21</button><button class="keno-num">22</button><button class="keno-num">23</button><button class="keno-num">24</button><button class="keno-num">25</button><button class="keno-num">26</button><button class="keno-num">27</button><button class="keno-num">28</button><button class="keno-num">29</button><button class="keno-num">30</button><button class="keno-num">31</button><button class="keno-num">32</button><button class="keno-num">33</button><button class="keno-num">34</button><button class="keno-num">35</button><button class="keno-num">36</button><button class="keno-num">37</button><button class="keno-num">38</button><button class="keno-num">39</button><button class="keno-num">40</button></div><div class="payouts"><span>1 совп.<br>×1.4</span><span>2 совп.<br>×9.2</span><span>3 совп.<br>×17.0</span><span>4 совп.<br>×24.8</span><span>5 совп.<br>×32.6</span><span>6 совп.<br>×40.4</span><span>7 совп.<br>×48.2</span><span>8 совп.<br>×56.0</span><span>9 совп.<br>×63.8</span><span>10 совп.<br>×71.6</span></div><div class="game-bottom"><span>БАЛАНС: <b class="balance-value">10 000</b></span><span id="kr">ГОТОВ</span></div></section></div></main><script>const BALKEY='arcanaDemoBalance';function getBal(){return Number(localStorage.getItem(BALKEY)||10000)}function setBal(v){localStorage.setItem(BALKEY,Math.max(0,Math.round(v)));document.querySelectorAll('.wallet b,.balance-value').forEach(x=>x.textContent=getBal().toLocaleString('ru-RU'))}document.addEventListener('DOMContentLoaded',()=>setBal(getBal()));</script><script>let sel=[];const cells=[...document.querySelectorAll('.keno-num')],km=document.getElementById('km'),bet=document.getElementById('bet');function update(){km.textContent='Выбрано: '+sel.length+'/10'}cells.forEach(b=>b.onclick=()=>{if(b.classList.contains('drawn')||b.classList.contains('hit'))return;let x=+b.textContent;if(sel.includes(x)){sel=sel.filter(v=>v!==x);b.classList.remove('selected')}else if(sel.length<10){sel.push(x);b.classList.add('selected')}update()});clear.onclick=()=>{sel=[];cells.forEach(x=>x.className='keno-num');update()};auto.onclick=()=>{clear.click();while(sel.length<10){let x=1+Math.floor(Math.random()*40);if(!sel.includes(x)){sel.push(x);cells[x-1].classList.add('selected')}}update()};draw.onclick=()=>{let b=Number(bet.value)||0;if(!sel.length){km.textContent='Сначала выбери числа';return}if(b<1||b>getBal()){km.textContent='Проверь ставку';return}let d=[];while(d.length<10){let x=1+Math.floor(Math.random()*40);if(!d.includes(x))d.push(x)}cells.forEach(c=>{let x=+c.textContent;c.classList.remove('drawn','hit');if(d.includes(x))c.classList.add(sel.includes(x)?'hit':'drawn')});let hits=sel.filter(x=>d.includes(x)).length;let payout=hits?Math.round(b*(1+hits*1.6)):0;setBal(getBal()-b+payout);km.textContent='Выпало: '+d.join(', ')+' · Совпадений: '+hits;kr.textContent=hits?'ВЫИГРЫШ '+payout:'ПРОИГРЫШ'};</script></body></html>
