<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCANA Dice</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">ARCANA <span>◆</span></a><nav><a href="/mines.html">MINES</a><a href="/coinflip.html">COIN FLIP</a><a href="/dice.html">DICE</a><a href="/keno.html">KENO</a></nav><div class="wallet">DEMO <b>10 000</b> ◆</div></header><main class="game-page"><div class="game-shell"><aside class="side"><div class="side-banner">DICE<span>OVER / UNDER</span></div><h3>Режим</h3><div class="seg"><button class="active" id="under">МЕНЬШЕ</button><button id="over">БОЛЬШЕ</button></div><h3>Целевое число: <span id="tv">50</span></h3><input class="field" id="target" type="range" min="5" max="95" value="50"><h3>Ставка</h3><input class="field" id="bet" type="number" min="1" value="100"><button class="action" id="roll">БРОСИТЬ</button><p class="muted" id="dm">Настрой шанс и бросай.</p></aside><section class="game-stage dice-stage"><div class="stage-title">DICE · LIVE ROLL</div><div class="dice-number" id="num">--</div><div class="dice-wheel">🎲</div><div class="chance"></div><div class="chance-info">ЦЕЛЬ <b id="goal">50</b> · КОЭФФИЦИЕНТ <b id="coef">×1.98</b></div><div class="game-bottom"><span>БАЛАНС: <b class="balance-value">10 000</b></span><span id="result">ГОТОВ</span></div></section></div></main><script>const BALKEY='arcanaDemoBalance';function getBal(){return Number(localStorage.getItem(BALKEY)||10000)}function setBal(v){localStorage.setItem(BALKEY,Math.max(0,Math.round(v)));document.querySelectorAll('.wallet b,.balance-value').forEach(x=>x.textContent=getBal().toLocaleString('ru-RU'))}document.addEventListener('DOMContentLoaded',()=>setBal(getBal()));</script><script>let mode='under';const t=document.getElementById('target'),n=document.getElementById('num'),bet=document.getElementById('bet');function sync(){tv.textContent=goal.textContent=t.value;coef.textContent='×'+(99/Math.max(1,(mode==='under'?+t.value:100-+t.value))).toFixed(2)}t.oninput=sync;under.onclick=()=>{mode='under';under.classList.add('active');over.classList.remove('active');sync()};over.onclick=()=>{mode='over';over.classList.add('active');under.classList.remove('active');sync()};roll.onclick=()=>{let b=Number(bet.value)||0;if(b<1||b>getBal()){dm.textContent='Проверь ставку и баланс';return}let x=Math.floor(Math.random()*100)+1;n.textContent=x;let ok=mode==='under'?x<+t.value:x>+t.value;let payout=ok?Math.round(b*Number(coef.textContent.slice(1))):0;setBal(getBal()-b+payout);n.classList.remove('win-number','loss-number');n.classList.add(ok?'win-number':'loss-number');dm.textContent=ok?'✓ ПОБЕДА! +'+(payout-b):'✕ ПРОИГРЫШ';result.textContent=ok?'ВЫИГРЫШ '+payout:'ПРОИГРЫШ '+b};sync()</script></body></html>
