<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCANA Dice</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">ARCANA <span>◆</span></a><nav><a href="/mines.html">MINES</a><a href="/coinflip.html">COIN FLIP</a><a href="/dice.html">DICE</a><a href="/keno.html">KENO</a></nav><div class="wallet">DEMO <b>10 000</b> ◆</div></header><main class="game-page"><div class="game-shell"><aside class="side"><div class="side-banner">DICE<span>OVER / UNDER</span></div><h3>Режим</h3><div class="seg"><button class="active" id="under">МЕНЬШЕ</button><button id="over">БОЛЬШЕ</button></div><h3>Целевое число: <span id="tv">50</span></h3><input class="field" id="target" type="range" min="5" max="95" value="50"><h3>Ставка</h3><input class="field" value="100"><button class="action" id="roll">БРОСИТЬ</button><p class="muted" id="dm">Настрой шанс и бросай.</p></aside><section class="game-stage dice-stage"><div class="stage-title">DICE · LIVE ROLL</div><div class="dice-number" id="num">--</div><div class="dice-wheel">🎲</div><div class="chance"></div><div class="chance-info">ЦЕЛЬ <b id="goal">50</b> · КОЭФФИЦИЕНТ <b id="coef">×1.98</b></div></section></div></main><script>let mode='under';target.oninput=()=>{tv.textContent=goal.textContent=target.value;coef.textContent='×'+(99/Math.max(1,(mode==='under'?target.value:100-target.value))).toFixed(2)};under.onclick=()=>{mode='under';under.classList.add('active');over.classList.remove('active');target.oninput()};over.onclick=()=>{mode='over';over.classList.add('active');under.classList.remove('active');target.oninput()};roll.onclick=()=>{let n=Math.floor(Math.random()*100)+1;num.textContent=n;let win=mode==='under'?n<+target.value:n>+target.value;dm.textContent=win?'ПОБЕДА!':'ПОПРОБУЙ ЕЩЁ';target.oninput()}</script></body></html>
