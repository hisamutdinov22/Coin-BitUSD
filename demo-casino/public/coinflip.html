<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCANA Coin Flip</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">ARCANA <span>◆</span></a><nav><a href="/mines.html">MINES</a><a href="/coinflip.html">COIN FLIP</a><a href="/dice.html">DICE</a><a href="/keno.html">KENO</a></nav><div class="wallet">DEMO <b>10 000</b> ◆</div></header><main class="game-page"><div class="game-shell"><aside class="side"><div class="side-banner gold">COIN FLIP<span>ОРЁЛ ИЛИ РЕШКА</span></div><h3>Ставка</h3><input class="field" id="bet" value="100"><div class="seg"><button class="active" id="heads">ОРЁЛ</button><button id="tails">РЕШКА</button></div><button class="action" id="flip">ПОДБРОСИТЬ</button><p class="muted" id="cm">Выбери сторону.</p></aside><section class="game-stage coin-stage"><div class="stage-title">COIN FLIP · ×1.92</div><div class="coin" id="coin">🦅</div><div class="coin-choices"><button class="choice">🦅 ОРЁЛ</button><button class="choice">🌙 РЕШКА</button></div><div class="history" id="hist"></div></section></div></main><script>let choice='heads';heads.onclick=()=>{choice='heads';heads.classList.add('active');tails.classList.remove('active')};tails.onclick=()=>{choice='tails';tails.classList.add('active');heads.classList.remove('active')};flip.onclick=()=>{coin.classList.remove('flip');void coin.offsetWidth;coin.classList.add('flip');let r=Math.random()<.5?'heads':'tails';setTimeout(()=>{coin.textContent=r==='heads'?'🦅':'🌙';cm.textContent=r===choice?'ПОБЕДА! +92 DEMO':'НЕ ПОВЕЗЛО';let s=document.createElement('span');s.textContent=r==='heads'?'🦅':'🌙';hist.prepend(s)},1900)}</script></body></html>
